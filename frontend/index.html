<html lang="en" class="dark">

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AURA - The New Standard. Shop elevated essentials, trending fashion, and premium accessories at amazing prices." />
    <meta name="keywords" content="aura, fashion, clothing, premium, online shopping, trend" />

    <meta property="og:description" content="The coolest premium fashion brand. Shop trending styles." />

    <title>AURA - The New Standard</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      (function() {
        const theme = localStorage.getItem('theme') || 'dark';
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
          root.classList.remove('light');
        } else if (theme === 'light') {
          root.classList.add('light');
          root.classList.remove('dark');
        } else {
          const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isSystemDark) {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
